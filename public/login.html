<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marah | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-brand-900 via-brand-700 to-brand-500 px-4 font-sans text-slate-700 antialiased">

  <form id="form-login" novalidate class="w-full max-w-sm space-y-4 rounded-2xl bg-white p-8 shadow-2xl">
    <div class="flex flex-col items-center gap-2">
      <img src="img/logo-Marah.png" alt="Marah" class="h-16 w-16 object-contain">
      <h1 class="text-2xl font-serif font-semibold text-slate-900">Iniciar sesión</h1>
      <p class="text-sm text-slate-500">Panel de administración</p>
    </div>

    <div>
      <label for="correo" class="mb-1 block text-sm font-medium">Correo electrónico</label>
      <input type="email" id="correo" autocomplete="username" class="campo">
    </div>

    <div>
      <label for="password" class="mb-1 block text-sm font-medium">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" class="campo">
    </div>

    <p id="mensaje-error" class="hidden rounded-lg bg-rose-50 p-3 text-sm text-rose-700"></p>

    <button type="submit" class="btn-primary w-full">Ingresar</button>

    <a href="index.html" class="block text-center text-sm text-slate-500 transition hover:text-brand-600">← Volver a la tienda</a>
  </form>

  <script src="js/login.js"></script>
</body>
</html>
